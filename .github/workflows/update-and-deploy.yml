name: Refresh oil intelligence and deploy iPhone app
on:
  workflow_dispatch:
  schedule:
    # Daily morning refresh.
    - cron: "15 5 * * *"
    # Every 20 minutes on weekday evenings (UTC 15:00-22:40): the Wednesday 10:30 a.m. ET release (15:30 UTC in winter,
    # 14:30 in summer, so 14:x too) and holiday moves (Thursday noon, Monday 5 p.m.). GitHub runs schedules best-effort,
    # often late, so the slots are close together; a run with nothing new just republishes the same data.
    - cron: "*/20 14-22 * * 1-5"
permissions:
  contents: read
  actions: write  # lets the keep-alive step stop GitHub disabling the schedule after 60 quiet days
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install free dependencies
        run: pip install -r requirements.txt pytest
      - name: Run tests
        run: python -m pytest -q tests
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Restore last published snapshot
        # data.json is never committed, so without this a failed source falls back to the bundled demo week.
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          if curl -fsS --max-time 20 "$BASE_URL/data.json" -o "$RUNNER_TEMP/live.json" \
             && python scripts/restore_snapshot.py "$RUNNER_TEMP/live.json" > "$RUNNER_TEMP/images.txt"; then
            cp "$RUNNER_TEMP/live.json" site/data.json
            mkdir -p site/images
            while read -r img; do
              [ -n "$img" ] && curl -fsS --max-time 30 "$BASE_URL/$img" -o "site/$img" || true
            done < "$RUNNER_TEMP/images.txt"
            echo "Restored published snapshot."
          else
            echo "No usable published snapshot; starting from the bundled file."
          fi
      - name: Fetch official inventories and satellite imagery
        run: python scripts/update.py
      - name: Stamp the build
        # Versioned asset URLs and a new service worker per deploy, so phones never mix old and new files.
        run: |
          build="$(date -u +%Y%m%d%H%M)-${GITHUB_SHA::7}"
          sed -i "s/__BUILD__/$build/g" site/index.html site/sw.js
          grep -q "$build" site/sw.js && echo "Build $build"
      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Publish
        id: deploy
        uses: actions/deploy-pages@v5
      - name: Keep the schedule alive
        # GitHub turns off scheduled workflows in repos with no commits for 60 days; re-enabling resets that.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update-and-deploy.yml/enable"
