name: Refresh oil intelligence and deploy iPhone app
on:
  workflow_dispatch:
  schedule:
    # Daily refresh. Wednesday/Thursday frequent polls catch regular or holiday EIA releases.
    - cron: "15 5 * * *"
    - cron: "10 15,16,17,18,19,20 * * 3,4"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install free dependencies
        run: pip install -r requirements.txt pytest
      - name: Run tests
        run: python -m pytest -q tests
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Restore last published snapshot
        # data.json is never committed, so without this a failed source falls back to the bundled demo week.
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          if curl -fsS --max-time 20 "$BASE_URL/data.json" -o "$RUNNER_TEMP/live.json" \
             && python scripts/restore_snapshot.py "$RUNNER_TEMP/live.json" > "$RUNNER_TEMP/images.txt"; then
            cp "$RUNNER_TEMP/live.json" site/data.json
            mkdir -p site/images
            while read -r img; do
              [ -n "$img" ] && curl -fsS --max-time 30 "$BASE_URL/$img" -o "site/$img" || true
            done < "$RUNNER_TEMP/images.txt"
            echo "Restored published snapshot."
          else
            echo "No usable published snapshot; starting from the bundled file."
          fi
      - name: Fetch official inventories and satellite imagery
        run: python scripts/update.py
      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Publish
        id: deploy
        uses: actions/deploy-pages@v5
